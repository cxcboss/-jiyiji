<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#eaf7ec">
  <title>节奏挤一挤 · Jelly Jam</title>
  <link rel="manifest" href="manifest.json?v=26">
  <link rel="icon" href="assets/icon.png">
  <link rel="preload" href="assets/crew-cartoon.webp?v=26" as="image">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="club.css?v=26">
  <script defer src="js/cast.js?v=26"></script>
  <script defer src="js/physics.js?v=26"></script>
  <script defer src="js/ads.js?v=26"></script>
  <script defer src="js/characters.js?v=26"></script>
  <script defer src="js/progress.js?v=26"></script>
  <script defer src="js/sound.js?v=26"></script>
  <script defer src="js/interface.js?v=26"></script>
  <script defer src="js/game.js?v=26"></script>
</head>
<body data-state="home" data-skin="cartoon" data-stage="cartoon">
  <div class="ambient" aria-hidden="true"></div>
  <div class="handheld">
    <section id="home" class="home" aria-label="游戏主页">
      <!-- Full-bleed living animated game stage backdrop -->
      <div class="sleeve" id="sleeveBox">
        <canvas id="sleeveArt" aria-label="点击和舞台上的果冻伙伴互动"></canvas>
      </div>

      <!-- Top Floating Game HUD (top-right strictly clear for WeChat capsule) -->
      <header class="home-head">
        <button id="freeCoinsBtn" class="coin-pill" title="免费领 150 音符币">
          <canvas data-icon="coin"></canvas>
          <b data-coins>120</b>
          <span class="coin-plus"><canvas data-icon="plus"></canvas></span>
        </button>
        <div class="wx-capsule-space" aria-hidden="true"></div>
      </header>

      <!-- Floating Left Vertical Game Icon Rail -->
      <nav class="home-side-rail" aria-label="快捷福利与设置">
        <button id="homeCheckin" class="side-game-btn is-gift" aria-label="每日福利">
          <span class="side-btn-box"><canvas data-icon="gift"></canvas><i id="checkinDot" class="red-dot" hidden></i></span>
          <span class="side-btn-txt">福利</span>
        </button>
        <button id="homeWheel" class="side-game-btn is-wheel" aria-label="幸运转盘">
          <span class="side-btn-box"><canvas data-icon="wheel"></canvas><i id="wheelDot" class="red-dot" hidden></i></span>
          <span class="side-btn-txt">转盘</span>
        </button>
        <button id="homeSettings" class="side-game-btn is-set" aria-label="游戏设置">
          <span class="side-btn-box"><canvas data-icon="settings"></canvas></span>
          <span class="side-btn-txt">设置</span>
        </button>
      </nav>

      <!-- Floating Right Badges (positioned cleanly below WeChat capsule) -->
      <div class="home-right-rail">
        <div class="home-best-pill" aria-label="无尽最高分">
          <canvas data-icon="trophy"></canvas>
          <span>最高</span>
          <b data-best>0</b>
        </div>
        <button class="cover-label" id="coverSkins" aria-label="更换皮肤与舞台">
          <canvas data-icon="layers"></canvas><span id="coverStage">经典卡通</span>
        </button>
      </div>

      <!-- Sculptural 3D Game Logo -->
      <div class="hero-logo-wrap" aria-hidden="true">
        <h1 class="cover-title"><span>节奏</span><span>挤一挤</span></h1>
      </div>

      <!-- Bottom Floating Game Console: Single Hero Play Button + Dock -->
      <div class="home-footer">
        <button id="start" class="start-btn">
          <span class="start-play"><canvas data-icon="play"></canvas></span>
          <span id="startLabel">开始游戏</span>
          <span class="start-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </button>

        <div class="home-dock">
          <button id="homeSkins" class="dock-btn dock-skin">
            <span class="dock-icon"><canvas data-icon="layers"></canvas></span>
            <strong>换装</strong>
          </button>
          <button id="homeGuide" class="dock-btn dock-guide">
            <span class="dock-icon"><canvas data-icon="music"></canvas></span>
            <strong>图鉴</strong>
          </button>
          <button id="homeBadges" class="dock-btn dock-medal">
            <i id="badgeDot" class="red-dot" hidden></i>
            <span class="dock-icon"><canvas data-icon="trophy"></canvas></span>
            <strong>奖杯</strong>
          </button>
        </div>
      </div>
    </section>

    <div class="game-view" id="gameView" inert aria-hidden="true">
      <header class="game-top" aria-label="对局信息栏">
        <div class="hud-top-strip">
          <div class="hud-status-bar">
            <span id="hudPhase" class="hud-phase-pill">热身节奏</span>
            <i class="hud-sep" aria-hidden="true"></i>
            <span class="hud-time-row"><canvas data-icon="clock"></canvas><b id="hudTime">00:00</b></span>
          </div>
          <div class="wx-capsule-space" aria-hidden="true"></div>
        </div>
        <div class="hud-score-row">
          <div class="hud-cur-score">
            <span class="hud-score-tag">得分</span>
            <b class="score" data-score>0</b>
          </div>
          <div id="bestPill" class="best-pill" title="最高记录"><canvas data-icon="trophy"></canvas><span>最高</span><b data-best>0</b></div>
        </div>
      </header>

      <main class="rig">
        <section class="arena-column" aria-label="合成舞台">
          <div class="cabinet">
            <div class="field">
              <canvas id="underlay" aria-hidden="true"></canvas>
              <canvas id="skins" aria-hidden="true"></canvas>
              <canvas id="play" tabindex="0" aria-describedby="queueText" aria-label="轻点任意角色下方即可直落，按住下滑可瞄准发射。"></canvas>
              <button id="newCharBanner" class="new-char-banner" hidden><canvas data-icon="video"></canvas><span id="newCharText">新角色解锁！点此双倍领奖</span></button>
              <div id="floatTip" class="float-tip" hidden></div>
              <button id="saveBtn" class="save-btn" hidden><canvas data-icon="hammer"></canvas><span>免费急救</span></button>
              <div id="danger" class="danger" hidden>快要越线啦！</div>
              <div id="callout" class="callout" aria-hidden="true"></div>
            </div>
          </div>

          <div class="prop-dock" id="propDock" aria-label="局内道具与暂停栏">
            <button class="prop-btn p-hammer" data-prop="hammer" title="点选果冻消除或破冰">
              <canvas data-icon="hammer"></canvas>
              <span class="prop-label">小锤子</span>
              <i class="prop-count">2</i>
            </button>
            <button class="prop-btn p-wild" data-prop="wild" title="彩虹万能球，碰谁升谁">
              <canvas data-icon="spark"></canvas>
              <span class="prop-label">彩虹球</span>
              <i class="prop-count">1</i>
            </button>
            <button id="pause" class="prop-btn prop-pause-btn" aria-label="暂停游戏" title="暂停游戏">
              <canvas data-icon="pause"></canvas>
              <span class="prop-label">暂停</span>
            </button>
            <button class="prop-btn p-freeze" data-prop="freeze" title="冻住横杆12秒并开启双倍得分">
              <canvas data-icon="snow"></canvas>
              <span class="prop-label">双倍冻</span>
              <i class="prop-count">1</i>
            </button>
            <button class="prop-btn p-lift" data-prop="lift" title="强力顶起横杠并压低上升地板">
              <canvas data-icon="lift"></canvas>
              <span class="prop-label">抬杠</span>
              <i class="prop-count">1</i>
            </button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" hidden><canvas data-icon="medal"></canvas><span></span></div>
  </div>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <div id="dialogToast" class="dialog-toast" role="status" hidden><canvas data-icon="medal"></canvas><span></span></div>
    <div class="modal-top">
      <h2 id="dialogTitle"></h2>
    </div>
    <div id="dialogBody"></div>
    <div class="dialog-actions" id="dialogActions"></div>
  </dialog>
  <p id="queueText" class="sr-only"></p>
  <p id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
